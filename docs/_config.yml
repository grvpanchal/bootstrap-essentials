# Dependencies
markdown:         kramdown
highlighter:      rouge

# Permalinks
permalink:        pretty

title: Bootstrap Essentials
description: Essential and common classes for bootstrap for faster web development

# Server
url:              http://bootstrapessentials.com

author:
  twitter: grvpanchal

encoding:         UTF-8

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Custom vars
bootstrap_version: 3.4.1
current_version:  1.0.0
repository:       https://github.com/grvpanchal/bootstrap-essentials

download:
  source:         https://github.com/grvpanchal/bootstrap-essentials/archive/v1.0.0.zip
  dist:           https://github.com/grvpanchal/bootstrap-essentials/releases/download/v1.0.0/bootstrap-essentials-1.0.0-dist.zip
  bootstrap:       https://github.com/twbs/bootstrap/releases/download/v3.4.1/bootstrap-3.4.1-dist.zip

exclude: 
  - .gitignore
  - README.md
